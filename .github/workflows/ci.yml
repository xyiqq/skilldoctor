name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test CLI on the example skill
        run: |
          node dist/cli.js lint examples
          node dist/cli.js audit examples
          node dist/cli.js compat examples
          node dist/cli.js ci examples
